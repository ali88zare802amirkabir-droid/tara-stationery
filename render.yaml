# Render blueprint for Tara — free-tier Next.js web service.
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tara-stationery
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://tara-store.onrender.com"